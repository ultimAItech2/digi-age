[preset.0]
name="Linux Desktop"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/ui/*,assets/fonts/Cinzel.ttf"
exclude_filter="art/*,tests/*,docs/*,builds/*,README.md,LICENSE,tools/*"
export_path="builds/linux/DigitalAge.x86_64"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=".tools/templates/linux_release.x86_64"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=false
export_filter="all_resources"
include_filter="assets/ui/*,assets/fonts/Cinzel.ttf"
exclude_filter="art/*,tests/*,docs/*,builds/*,README.md,LICENSE,tools/*"
export_path="builds/windows/DigitalAge.exe"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=".tools/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
