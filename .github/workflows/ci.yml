name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
          ./tools/setup.sh
      - name: Verify committed CC0 assets
        run: python3 -I tools/fetch_cc0_assets.py --verify
      - name: Import resources
        run: ./tools/godot.sh --headless --editor --import --quit 2>&1 | tee builds/import.log
      - name: Headless tests
        run: ./tools/test.sh
      - name: Rendered UI matrix
        run: ./tools/render_ui.sh
      - name: Rendered scene (OpenGL gate)
        run: ./tools/render_scene.sh --gl
      - name: Rendered scene (Forward+ on lavapipe)
        continue-on-error: true
        run: ./tools/render_scene.sh --vulkan
      - name: Scene captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-captures
          path: builds/scene-*
      - name: UI verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: builds/ui/
      - name: Version fields agree
        run: python3 tools/version.py --check
      - name: Build, package and verify Linux and Windows
        run: ./tools/build.sh
      - name: Packages
        uses: actions/upload-artifact@v4
        with:
          name: digital-age-${{ github.sha }}
          path: |
            builds/DigitalAge-linux-x86_64.tar.gz
            builds/DigitalAge-windows-x86_64.zip
            builds/SHA256SUMS
            builds/BUILD_ID.json
            builds/package-verification.json
          retention-days: 14
