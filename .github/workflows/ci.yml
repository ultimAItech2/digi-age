name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          ./tools/setup.sh
      - name: Headless tests
        run: ./tools/test.sh
      - name: Linux export smoke
        run: |
          ./tools/godot.sh --headless --export-release "Linux Desktop"
          test -x builds/linux/DigitalAge.x86_64
          ./builds/linux/DigitalAge.x86_64 --headless --quit
